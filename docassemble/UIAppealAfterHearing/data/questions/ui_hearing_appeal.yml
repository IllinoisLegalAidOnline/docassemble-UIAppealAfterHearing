id: welcome
question: |
  Unemployment benefits appeal after a hearing
subquestion: |
  Welcome to Illinois Legal Aid Online's **${ ilao_easy_form_title }** Easy Form.

  If you are denied unemployment benefits after a referee hearing, you can appeal the decision. This program will make a Notice of Appeal to the Illinois Department of Employment Security (IDES) Board of Review. 

  To learn more, read ILAO's article about [appealing a referee's unemployment benefits decision](https://www.illinoislegalaid.org/node/32466).

field: sees_nav_bar
---
id: instructions
continue button field: how_to_use
question: |
  Instructions
subquestion: |
  To use this program you will need:

  * A decision letter from an IDES hearing referee, and
  * Your Claimant ID (printed on the letter) or the last 4 digits of your Social Security Number.
  
  Set aside 5 to 10 minutes to finish this program. You can log in and save your work to continue later. 
 
  ${ collapse_template(help_example) }  

  Click on **{green words}** to learn what they mean. Some pages have a question mark in a circle ${ fa_icon("question-circle", color_css="#0dcaf0" ) } that helps explain things.
---
template: help_example
subject: |
  **You can click sections like this to show more information.**
content: |  
  This is an example of help. Click again to hide.
---
id: about ui benefits
continue button field: about_ui_bens
question: |
  About unemployment insurance appeals
subquestion: |
  If you are denied unemployment benefits, you have 3 opportunities to appeal:

  1. File a [**Request for Reconsideration**](https://www.illinoislegalaid.org/legal-information/unemployment-benefits-request-hearing) to ask IDES to review a claim adjudicator's decision. The Request for Reconsideration must be filed **within 30 days** after the claim adjudicator determination is delivered. You will have a hearing with an IDES referee who will make a decision.
  
  2. After your hearing, if you don't agree with the referee's decision, file an appeal with the Board of Review. The appeal must be filed **within 30 days** after the Referee's Decision is delivered. **This Easy Form makes a Notice of Appeal to the Board of Review.**
  
  3. Finally, if you don't agree with the Board of Review's decision, file an Administrative Review Action (ARA) in Circuit Court. The ARA must be filed **within 35 days** of the Board of Review's decision.

  **Note:** IDES offers free legal services to people who are appealing unemployment benefit decisions. See the [**IDES Legal Services Program**](https://ides.illinois.gov/resources/legal-services-program/legal-services.html) to find out if you qualify.
---
id: received decision letter
question: |
  Did you get a decision letter from IDES?
subquestion: |
  This is a letter from a hearing referee at the Illinois Department of Employment Security (IDES).
fields:
  - no label: received_denial_letter
    datatype: yesnoradio
---
id: no decision letter
event: no_decision_letter
question: |
  Sorry
subquestion: |
  You must have received a deision letter from IDES to create a Notice of Appeal to the Board of Review.

  To learn more, read ILAO's article about [being denied unemployment insurance](https://www.illinoislegalaid.org/node/32541).

  You may want to talk with a lawyer to discuss your options. Use [**Get Legal Help**](https://www.illinoislegalaid.org/get-legal-help) to find free or low-cost legal services in your area.
buttons:
  - Exit: exit
  - Restart: restart
---
