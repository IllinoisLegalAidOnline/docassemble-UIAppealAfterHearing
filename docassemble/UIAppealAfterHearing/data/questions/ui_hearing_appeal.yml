    datatype: date
    max: ${ today().format("yyyy-MM-dd") }
---
id: late appeal
question: |
  Explain why you are late to file an appeal
subquestion: |
  You have thirty (30) days from the date on the decision letter to send in your Notice of Appeal. Based on the date of the decision, ${ decision_date }, your appeal is considered late. For IDES to consider your appeal, you must explain why it is filed late.

  Click **Back** if you want to change the decision date. Or you can explain why you are filing after 30 days and click **Next** to make your appeal even though it is late.
fields: 
  - My appeal is late because:: late_reason
    datatype: area
    rows: 7
    maxlength: 300
  - note: |
      **Note:** The form has room for about **300 characters** including spaces.
---
