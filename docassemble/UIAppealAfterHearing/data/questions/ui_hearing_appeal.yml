subject: |
  **Learn more about finding your Claimant ID**
content: |  
  The Claimant ID can be found in the upper-right of the UI Finding letter, as well as other letters and emails received from IDES.
  
  [FILE ui.findling.letter.snip.png, 100%, Locating a Claimant ID on IDES letter]
