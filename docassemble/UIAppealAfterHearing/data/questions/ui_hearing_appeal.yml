    maxlength: 25
---
################# Your Appeal #######################
id: termination type
question: |
  How did your job end?
subquestion: |
  Your job could have ended:

  * Voluntarily, for example you quit your job, or
  * Involuntarily, for example you were fired or the business closed.

  This matters because it affects what you will say in your appeal.
fields:
  - How did your job end?: termination_type
    datatype: radio
    choices: 
      - I quit.: quit
      - I was fired.: fired
---
id: quit intro
question: |
  Must have quit for good cause
subquestion: |
  To get benefits, you must prove that you quit for a good cause.

  IDES may decide you quit for a good cause and thus allow you to receive benefits if you can show one of these reasons applies to your situation.

  * The job posed a risk to your health, safety, or morals.
  * You were not able to perform your work.
  * You left because of your medical problem or the medical problem of a spouse, child, or parent. You gave your employer a doctor's note proving the illness or disability, and you told your employer you were going to miss work.
  * Your employer was violating laws regarding your wages or work conditions.
  * Your employer greatly reduced your pay, your hours, or your benefits.
  * You left your job because you had a serious job offer (including a starting date and rate of pay), and you stayed at your current job until just before the new job was to start.
  * For some other reason, your workplace or working conditions were such that any reasonable worker would want to quit. These reasons should be related to your ability to do your job, not what is happening in your life outside of your job.
continue button field: quit_intro  
---
id: quit solve problems
question: |
  Explain how you tried to solve problems
subquestion: |
  You also need to show that before you quit, you tried to solve the problems you were having at your job.

  For example, you could explain:

  * If you sent in a formal complaint about working conditions,
  * If you went to talk about your work problems with your supervisor and tried to work out a solution, or
  * If you told your supervisor about family or medical needs that required an adjustment to your work schedule.
  
  If you did not try to solve the problem before quitting, it can be helpful to explain why.
continue button field: quit_solve_problems
---
template: not_misconduct_help 	
subject: |
  **How do I know if what I did was misconduct?**	
content: |
  The following situations are usually not misconduct.

    * You were fired because your employer thought your work wasn't good enough, but you had tried your best to do it right. For example, if you made several mistakes while operating the cash register, but did not mean to make those mistakes.
    * You didn't know what you were doing was wrong because no one had told you or warned you about it. For example, if you were not warned by your supervisor that you should lock the tool cabinet, and you didn't know it was a rule.
    * You refused to do a dangerous job after you told your employer about the danger. For example, if your employer wanted you to work on a machine without safety glasses and you refused to do it because you thought it was too dangerous.
    * You were fired for reasons that were not related to how you do your job. One example is if your employer fired you because you were stopped for a traffic violation and driving is not part of your job.
    * You were absent or late but had a good reason and notified your employer. Be prepared to prove the reason for your last absence or lateness. If you think your employer will claim that you did not call in, you should order the phone records and bring them to the hearing.
    * Your employer asked you to do something illegal or immoral, and you refused.
    * Your employment ended because the business where you worked closed.
---
id: fired intro
question: |
  Being fired for misconduct
subquestion: |
  If your employer says you were fired for "misconduct," they must prove it. Misconduct means you intentionally broke a workplace rule or policy.

  To get benefits, you must show one of these is true:
  
  * You did not do what your employer says you did, or
  * What you did was not misconduct.

  ${ collapse_template(not_misconduct_help) }  

  For more information, see [Getting unemployment benefits if I was fired.](https://www.illinoislegalaid.org/legal-information/getting-unemployment-benefits-if-i-was-fired)
continue button field: fired_intro
---
template: example_help	
subject: |
  **Can I see some examples?**	
content: |
  Here are some examples:
  
  * "The decision letter I received says I was fired for misconduct. However, my employer refused to give me proper safety equipment. My job involves working with hazardous materials. When I told my boss I would not handle the waste without safety equipment, I was fired."

  * "The decision letter I received says that I was fired for misconduct because I could not keep up with the volume of work. It was not intentional. I fell behind because I did not have adequate training."

  * "The decision letter I received says that I was fired for misconduct. My employer said that I was a no-call-no-show, but I have text messages that show that I informed my employer that I was sick."

  * "The decision letter I received says I was fired for misconduct. I told my supervisor that I will be coming to work an hour late for the next two months so I could take my mother to physical therapy as she is recovering from surgery. My supervisor agreed to this in writing. However, the boss of my supervisor fired me for frequent tardiness despite this agreement."

  * "The decision letter I received says that I quit my job. I stopped going to work because I have a medical condition, and I was on approved FMLA leave."

  * "The decision letter I received says that I quit my job. I was working full-time when I started the job, but my employer took away a lot of my shifts and gave them to another employee after I complained to HR about discrimination."

  * "The decision letter I received says that I quit my job. My coworkers mocked me for my sexual orientation. I made complaints to HR, but nothing was done. I was having mental breakdowns and missing work. Eventually, I had to leave for my own mental health. I did not voluntarily quit. I was forced out due to the constant harassment."
---
### currently unused ###
template: ides_legal_services_help	
subject: |
  **Get legal help from IDES**	
content: |
  IDES has a [**legal services program**](https://ides.illinois.gov/resources/legal-services-program/legal-services.html) that can give you 1 hour of free legal help.
---
id: appeal reason
question: |
  Why are you appealing the ${ decision_date.format("MMMM d, YYYY") } decision?
subquestion: |
  Explain why you think the hearing referee's decision was wrong. You and your employer may have different views about what happened. This is why it is important to explain your side of the story.

  % if termination_type == "quit":
  If you **quit**, to receive unemployment benefits you must show that you left for a good reason. It can be helpful to show what you did to try to fix problems before you quit. See ILAO's article about [getting unemployment benefits if you quit your job](https://www.illinoislegalaid.org/node/32111).
  % else:
  If you were **fired**, your employer has to show that you were fired for misconduct. If you did not do what the employer said you did, you can explain that. Or you can explain how what you did was not misconduct. To learn more, see ILAO's article about [getting unemployment benefits if you were fired](https://www.illinoislegalaid.org/node/32491).
  % endif
  
  ${ collapse_template(example_help) }  
  
  **Note:** The form has room for about **1,500 characters** including spaces.
fields:
  - raw html: |
      <span id="areacounter" maxlength="1500">
  - no label: appeal_reason
    input type: area
    rows: 20
    maxlength: 1500
  - raw html: |
      </span>
script: |
  <script>
    $(document).on('daPageLoad', function() {
      var parent_el = document.getElementById('areacounter');
      if (!parent_el) return;
      var textarea = parent_el.parentNode.querySelector('textarea');
      if (!textarea) return;
      var counterId = textarea.id + "_counter";
      if (document.getElementById(counterId)) return;
      var maxLength = parseInt(parent_el.getAttribute('maxlength'), 10)

      var counter = document.createElement("div");
      counter.id = counterId;
      counter.style.textAlign = "right";
      counter.style.fontSize = "1em";
      counter.style.color = "#555";

      // insert the counter immediately below the textarea
      textarea.parentNode.insertBefore(counter, textarea.nextSibling);

      function updateCounter() {
        var len = textarea.value ? textarea.value.length : 0;
        counter.textContent = len + '/' + maxLength;
        if (len > maxLength) {
          counter.style.fontWeight = 'bold';
          counter.style.color = '#000';
        } else {
          counter.style.fontWeight = 'normal';
          counter.style.color = '#555';
        }
      }

      textarea.addEventListener('input', updateCounter);
      updateCounter();
    });
  </script>
---
id: any additional documents
question: |
  Additional documents
subquestion: |
  You can include up to five other documents with your appeal to help prove your claim.

  **Note:** You can only add documents or evidence if you did not present them at the hearing through no fault of your own.

  You need to send a copy of these documents to the Board of Review and to your former employer.

  Some things that may be helpful depending on your situation are:

    * Your medical records,
    * A letter from your doctor or another healthcare professional,
    * Phone records, in cases where the employer claims you were absent without calling in, or
    * Any other document you think supports your version of events.
fields:
  - Add documents?: attachments.there_are_any
    datatype: yesnoradio
---
id: additional document details
question: |
  ${ capitalize(ordinal(i)) } attachment details
fields: 
  - Document type: attachments[i].name.text 
    maxlength: 30
    help: |
      Example: Letter from my doctor
  - Short description of what the document shows: attachments[i].desc
    maxlength: 40
    help: |
      Example: Explains why I missed work
---
id: reason not presented
question: |
   Why didn't you present the documents at the referee hearing?
subquestion: |
  You said you did not present these documents at the hearing:

  % for el in attachments:
    * ${ el.name.text }
  % endfor
  % if attended_hearing == False:
  
  If the reason you did not present these documents at the hearing is because you did not attend, be sure to include that in your answer.
  % endif
fields:
  - "I did not present the documents at the hearing because:": not_at_hearing_reason
    datatype: area
    rows: 3
    maxlength: 150
  - note: |
      **Note:** The form has room for about **150 characters** including spaces.
---
id: any more documents
question: |
  Do you want to add any other documents to your appeal?
subquestion: |
  You can attach up to five documents. So far you told us about:

  % for el in attachments:
  * ${ el.name.text }
  % endfor

  **Note:** You can only add documents or evidence if you did not present them at the hearing through no fault of your own.  
fields:
  - Include another document?: attachments.there_is_another
    datatype: yesnoradio
