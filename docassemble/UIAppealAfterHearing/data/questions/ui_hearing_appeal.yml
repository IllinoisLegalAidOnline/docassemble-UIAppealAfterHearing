    required: False
---
id: certification reminder
question: |
  Remember to certify
subquestion: |
  <div class="alert alert-info ilao-info" role="alert">
    <h6 class="alert-heading">Remember to certify</h6>
    <p>During the appeal process, you must continue to certify that you are eligible for unemployment benefits for each two-week period you are unemployed.</p>
    <p>You can do this online or by phone using Tele-Serve.</p>
  </div>

  Learn more about how to certify for benefits on [IDES's website](https://ides.illinois.gov/unemployment/certify.html).
continue button field: recert_reminder
