    datatype: date
    max: ${ decision_date.format("yyyy-MM-dd") }
  - At what time was the referee hearing?: hearing_time
    datatype: time
    required: False
  - Who was the referee hearing judge?: hearing_judge
    maxlength: 50
    required: False
---
