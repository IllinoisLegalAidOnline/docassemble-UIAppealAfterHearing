question: |
  Almost done
subquestion: |
  After you click **Next**, it may take a few moments to finish making your forms.
  
  ###### You do not need to refresh your screen. Hang in there!

  [NEWLINE]
---
id: get docs screen
event: get_docs_screen
question: |
  Download
subquestion: |
  Your forms are ready. View and download your forms below. Click **:edit: Make changes** to fix any mistakes.

  This program **does not deliver** your forms to IDES or your former employer. You will need to do that yourself.

  ${ action_button_html(url_action('review_answers'), label=':edit: Make changes', color='success', size="md") }

  ${ al_user_bundle.download_list_html() }

  [NEWLINE]

  ${ al_user_bundle.send_button_html(show_editable_checkbox=False) }

  **Note:** This program **does not deliver** your forms to IDES or your former employer. You will need to do that yourself.
  
  Thank you for using ILAO Easy Forms!
under: |
  % if not user_logged_in():
  [${fa_icon("sign-in-alt", color="#0079d0", size="sm")} **Sign-in**](${url_of('login', next=interview_url())}) or [**create**](${url_of('register', next=interview_url())}) an ILAO Easy Form account to save your progress (optional).
  % endif

  ${ action_button_html(interview_url(i="docassemble.ILAO:feedback.yml", easy_form_interview=ilao_easy_form_url, easy_form_title=ilao_easy_form_title, easy_form_page=current_context().question_id, easy_form_variable=current_context().variable, local=False,reset=1), label=':comment: Was this program helpful?', color="#181c36", size="md", new_window=True) }
---
generic object: ALDocumentBundle
template: x.get_email_copy
content: |
  Send a copy of your forms to your email
---
generic object: ALDocumentBundle
template: x.send_email_template
subject: |
  Unemployment appeal forms
content: |
  Your forms are attached.
  
  Thanks for using ILAO Easy Forms!
  
  [Illinois Legal Aid Online](https://www.illinoislegalaid.org)
---
###################### ATTACHMENTS ##########################
objects:
  - al_user_bundle: ALDocumentBundle.using(elements=[instructions, notice_of_appeal, transcript_request, file_request, cover_letter], filename="ui_hearing_appeal_packet.pdf", title="All forms", enabled=True)
---
objects:
  - instructions: ALDocument.using(title="Instructions", filename="instructions.pdf", enabled=True, has_addendum=False)
  - notice_of_appeal: ALDocument.using(title=form_name, filename="notice_of_appeal.pdf", enabled=True, has_addendum=True)
  - cover_letter: ALDocument.using(title="Cover letter", filename="cover_letter.pdf", enabled=True, has_addendum=False)
  - transcript_request: ALDocument.using(title="Transcript Request", filename="transcript_request.pdf", has_addendum=True)
  - file_request: ALDocument.using(title="Review File Request", filename="file_request.pdf", has_addendum=True)
---
template: appeal_reason_formatted_template
content: |
  ${ "I disagree with the decision for the following reasons: " + appeal_reason }
  % if date_difference(decision_date, today()).days >= 30:
    % if late_reason:
    ${ "\nMy appeal is late because: " + late_reason }
    % endif
  % endif
  % if attended_hearing == False:
  ${ "\nI did not attend the " + hearing_date.format("MMMM dd, yyyy") + " hearing because: " + missed_hearing_explanation } 
  % endif
---
reconsider: True
code: |
  appeal_reason_formatted = str(appeal_reason_formatted_template)
---
code: |
  notice_of_appeal.overflow_fields["attachments"].overflow_trigger = 2
  notice_of_appeal.overflow_fields["appeal_reason_formatted"].overflow_trigger = 800

  notice_of_appeal.overflow_fields.gathered = True
---
code: |
  transcript_request.enabled = False
  file_request.enabled = False
  if request_transcript:
    transcript_request.enabled = True
    file_request.enabled = True

---
attachment:
  variable name: notice_of_appeal.addendum
  docx template file: additional_attachments.docx
---
attachment:
  variable name: instructions[i]
  name: instructions
  filename: instructions
  skip undefined: True
  docx template file: instructions.docx
---
attachment:
  variable name: cover_letter[i]
  name: cover_letter
  filename: cover_letter
  skip undefined: True
  docx template file: cover_letter.docx
---
attachment:
  - name: notice_of_appeal
    variable name: notice_of_appeal[i]
    filename: notice_of_appeal
    pdf template file: notice_of_appeal.pdf
    skip undefined: True
    editable: False
    fields:
      - "name": ${ users[0].name_full() }  
      - "appellant": "claimant"
      - "ssn": ${ int(users[0].id_or_ssn) }
      - "address1": ${ users[0].address.address }
      - "address2": ${ users[0].address.unit }
      - "city": ${ users[0].address.city }
      - "state": ${ users[0].address.state }
      - "zip": ${ users[0].address.zip }
      - "appeal_filed_date": ${ decision_date.format("MM/dd/yyyy") }
      - "docket_number": ${ docket_number }
      - "letter": True
      - "other": ${ attachments.there_are_any }
      - "other_explain": |
          % if attachments.there_are_any:
            % if len(attachments) > 1:
            Please see attached list of documents.
            % else:
            ${ attachments }
            % endif
          % else:
          ${""}
          % endif
      - "appeal_reason": |
          % if len(appeal_reason_formatted) > 800:
          Please see attached statement of reasons for appeal.
          % else:
          ${ appeal_reason_formatted }
          % endif
      - "service_name": ${ employer.name_full() }
      - "service_address": ${ employer.address.on_one_line() }
      - "service_date": ${ delivery_date.format("MM/dd/yyyy") }
      - "servedby": ${ "certified" if delivery_method == "certify" else "delivery" if delivery_method == "delivery" else '' }
---
attachment:
  - name: transcript_request
    variable name: transcript_request[i]
    filename: transcript_request
    pdf template file: transcript_request.pdf
    skip undefined: True
    editable: False
    fields:
      - "date": ${ today().format("MMMM d, yyyy") }
      - "claimant_id": ${ int(users[0].id_or_ssn) }
      - "bor_docket_number": ${ docket_number }
      - "claimant_cb": ${ True }
      - "appellant_cb": ${ True }
      - "referee_name": ${ hearing_judge if hearing_judge != '' else '' }
      - "hearing_time": ${ format_time(hearing_time, format='h:mm a') if hearing_time != '' else '' }
      - "hearing_date": ${ hearing_date }
      - "user_name": ${ users[0].name_full() }
---
attachment:
  - name: file_request
    variable name: file_request[i]
    filename: file_request
    pdf template file: file_request.pdf
    skip undefined: True
    editable: False
    fields:
      - "date": ${ today().format("MMMM d, yyyy") }
      - "claimant_id": ${ int(users[0].id_or_ssn) }
      - "bor_docket_number": ${ docket_number }
      - "claimant_cb": ${ True }
      - "user_name": ${ users[0].name_full() }
      - "user_name_2": ${ users[0].name_full() }