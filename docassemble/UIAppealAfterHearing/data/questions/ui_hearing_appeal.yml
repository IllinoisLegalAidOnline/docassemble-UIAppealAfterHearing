id: request transcript
question: |
  Do you want to review the transcript of the referee hearing and the record?
subquestion: |
  A transcript is a written copy of everything that was said at your referee hearing. The record includes the transcript and other documents from your case.
  
  You can ask IDES for these documents. They can help you write an additional statement explaining why you should receive benefits. There may be a fee if IDES sends you copies of the transcript and record. You can also make an appointment to go in person to review their files at 115 N. LaSalle, in Chicago, or at another IDES facility.

  **Important:** You will have only 10 days from when the transcript is mailed to you to send **an additional written statement** to the Board of Review and to your employer.
fields: 
  - Ask IDES for a transcript and copy of the record?: request_transcript
    datatype: yesnoradio
---
id: appeal date
question: |
  When you will send or deliver your appeal?
subquestion: |
  After you download your appeal forms, you will need to send them to IDES and to your former employer.

  % if date_difference(decision_date, today()).days >= 30:
  **Note:** Since it is already 30 days since your ${decision_date} decision letter, you should send it as soon as possible.
  % else:
  **Note:** Be sure to send your appeal within 30 days of when your decision letter was dated (${decision_date}).
  % endif
fields:
  - Date you will send or deliver your appeal: appeal_date
    datatype: date
    min: ${ today().format("yyyy-MM-dd") }
    required: False
  - note: |
      If you don't know this now, leave it blank. Be sure to add the date when you sign the Notice of Appeal.
---
id: delivery intro
question: |
  Deliver your appeal
subquestion: |
  This program creates a Notice of Appeal and a cover letter.

  You need to deliver the original Notice of Appeal and the cover letter to the Board of Review.
  
  * You can deliver them to the Chicago office at 115 South LaSalle Street, 19th Floor, in person, by mail, or fax to: (630) 645-3731.
  * You can also deliver them to your local IDES office. The local IDES office address and fax number should be on the decision letter. You can also use the [**IDES Office Locator**](https://ides.illinois.gov/about/locations.html).

  You also need to deliver, or "serve," a copy of the Notice of Appeal to your former employer. You can send the notice by certified mail, or you can deliver it in person.
continue button field: delivery_intro
---
sets:
  - employer.name.first
