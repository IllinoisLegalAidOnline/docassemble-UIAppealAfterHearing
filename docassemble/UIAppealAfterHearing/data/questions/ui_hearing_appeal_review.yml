#################### REVIEW SCREEN #########################
id: review screen
event: review_answers
question: |
  Review screen
subquestion: |
  Edit your answers below.
review:
  - note: |
     <h4>Referee hearing</h4>
  - Edit: received_denial_letter
    button: |
      **Received UI decision letter from IDES?**
      ${ word(yesno(received_denial_letter)) }
  - Edit: decision_date
    button: |
      **Decision date:**
      ${ decision_date }
  - Edit: late_reason
    button: |
      **Late appeal reason:**
      
      ${ late_reason }
    show if: date_difference(decision_date, today()).days >= 30
  - Edit: hearing_date
    button: |
      **Referee hearaing date:**
      ${ hearing_date }
  - Edit: attended_hearing
    button: |
      **Attended referee hearing?**
      ${ word(yesno(attended_hearing)) }
  - Edit: missed_hearing_explanation
    button: |
      **Reason for not attending referee hearing:**
      
      ${ missed_hearing_explanation }
    show if: attended_hearing == False
  - Edit: docket_number
    button: |
      **Docket number:**
      ${ docket_number }
  - note: |
     <h4>Your appeal</h4>
  - Edit: termination_type
    button: |
      **Termination type:**
      % if termination_type == "quit":
        I quit.
      % endif
      % if termination_type == "fired":
        I was fired.
      % endif
  - Edit: appeal_reason
    button: |
      **I disagree with the decision for the following reasons:**

      ${ appeal_reason }
  - Edit: attachments.there_are_any
    button: |
      **Including additional documents?**
      ${word(yesno(attachments.there_are_any))}      
  - Edit: attachments.revisit
    button: |
      **Addtitional documents to include:**
      
      % for doc in attachments:
      * ${ doc.name.text }, ${ doc.desc }
      % endfor
    show if: attachments.there_are_any
  - Edit: not_at_hearing_reason
    button: |
      **Reason why you did not present additional documents at the hearing:**
      
      ${ not_at_hearing_reason } 
    show if: attachments.there_are_any and ask_attachment_reason
  - Edit: employer.name.first
    button: |
      **Former employer:**
      ${ employer.name_full()}
  - Edit: employer.address.address
    button: |
      **Address for ${ employer.name_full()}:**
      ${ employer.address.on_one_line(bare=True) }
  - Edit: delivery_method
    button: |
      **Deliver to ${ employer.name_full() } through:**

      % if delivery_method == 'certify':
      * Mail
      % elif delivery_method == 'delivery':
      * Personal delivery
      % else:
      * I don't know. I will figure this out later.
      % endif
  - Edit: delivery_date
    button: |
      **Delivery date:**
      % if delivery_date:
      ${ delivery_date }
      % else:
      None entered - Be sure to add the date to your appeal when you sign it.
      % endif
  - note: |
     <h4>About You</h4>
  - Edit: users[0].name.first
    button: |
      **Your name:**
      ${ users[0].name_full() }
  - Edit: users[0].address.address
    button: |
      **Your address:**
      ${ users[0].address.on_one_line(bare=True) }
  - Edit: users[0].phone_number
    button: |
      **Your phone number:**
      % if users[0].phone_number == "":
      No phone number entered
      % else:
      ${ phone_number_formatted(users[0].phone_number) }
      % endif
  - Edit: users[0].id_or_ssn
    button: |
      **Claimant ID / last 4 SSN:**
      ${ int(users[0].id_or_ssn) }
---
